<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Page not found - Speech and language therapy leaflets</title>
  <!-- This page is shown for any address that doesn't exist, so it uses links from the site root ("/"). -->
  <link rel="stylesheet" href="/assets/style.css">
  <script>
    // Someone typed a short address such as /SW-001 or /sw001: send them to that leaflet.
    (function () {
      var m = /\/([A-Za-z]{2})-?(\d{1,3})\/?$/.exec(window.location.pathname);
      if (m) {
        var id = m[1].toUpperCase() + '-' + ('000' + m[2]).slice(-3);
        window.location.replace('/l/?id=' + id);
      }
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/"><span class="site-name">Speech and language therapy leaflets</span></a>
    </div>
  </header>
  <main id="main">
    <div class="container">
      <h1>Page not found</h1>
      <p>If you typed the web address, check it is correct.</p>
      <p>If you have a leaflet code, such as SW-001, you can type it on the home page.</p>
      <p><a class="button" href="/">Go to all leaflets</a></p>
    </div>
  </main>
</body>
</html>
